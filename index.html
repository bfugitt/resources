<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seasons of the Northwest</title>
<style>
  :root {
    --spruce: #1e3b34; --fog: #e8efec; --shell: #fbfaf6; --river: #1f6f78; --river-dk: #17535a;
    --bark: #6a4a33; --moss: #5d7f3f; --warn: #8a3b12; --line: #c3d1cc;
    --head: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --body: Verdana, Tahoma, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fog); color: var(--spruce); font: 1.05rem/1.6 var(--body); }
  #app { max-width: 820px; margin: 0 auto; padding: 16px 16px 96px; }
  h1, h2, h3, h4 { font-family: var(--head); line-height: 1.25; margin: 0 0 .4em; }
  h1 { font-size: 2.3rem; } h2 { font-size: 1.6rem; } h3 { font-size: 1.2rem; } h4 { font-size: 1.05rem; font-family: var(--body); }
  p { margin: 0 0 .8em; max-width: 68ch; }
  .lead { font-family: var(--head); font-size: 1.3rem; color: var(--river-dk); }
  .muted { color: #4f665f; margin: 0; }
  .hero svg { width: 100%; height: 150px; border-radius: 10px; display: block; margin-bottom: 18px; }
  .card { background: var(--shell); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin: 14px 0; }
  .note { background: #dde9e5; border-left: 6px solid var(--river); padding: 12px 16px; margin: 16px 0; border-radius: 0 8px 8px 0; }
  .note h3 { margin-bottom: .2em; }
  .say { list-style: none; padding: 0; display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 1em; }
  .say li { background: var(--shell); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; }
  .gloss { margin: 12px 0; } .gloss summary { cursor: pointer; font-weight: bold; padding: 6px 0; }
  .gloss dt { font-weight: bold; margin-top: .5em; } .gloss dd { margin: 0 0 0 1em; }
  .choose { margin-top: 24px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 14px 0; }
  .tools { margin-top: 6px; }
  .btn { font: inherit; min-height: 52px; padding: 10px 20px; border-radius: 10px; border: 2px solid var(--river); background: var(--shell); color: var(--river-dk); cursor: pointer; text-align: center; }
  .btn small { font-size: .85rem; opacity: .9; }
  .btn.primary { background: var(--river); color: #fff; }
  .btn.ghost { border-color: var(--line); color: var(--spruce); min-height: 44px; }
  .btn:hover:not(:disabled) { background: var(--river-dk); color: #fff; }
  .btn:disabled, .step:disabled, .choice:disabled { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 4px solid #e0a100; outline-offset: 2px; }
  .season-head { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
  .season-ico { font-size: 2.6rem; }
  .meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; background: var(--shell); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 14px 0; }
  .meter-top { display: flex; gap: 8px; align-items: baseline; font-size: .95rem; }
  .m-label { font-weight: bold; } .m-val { margin-left: auto; color: #3c544d; }
  .bar { height: 12px; background: #d6e2de; border-radius: 6px; overflow: hidden; margin-top: 4px; border: 1px solid #b4c6c0; }
  .fill { height: 100%; background: var(--moss); border-radius: 5px; transition: width .4s; }
  .extras { grid-column: 1 / -1; display: flex; gap: 22px; flex-wrap: wrap; font-size: .95rem; padding-top: 4px; border-top: 1px solid var(--line); }
  .teams-bar { position: sticky; top: 0; z-index: 5; background: var(--spruce); color: #fff; padding: 10px 16px; border-radius: 10px; margin-bottom: 8px; }
  .teams-bar .muted { color: #cfe0dc; }
  .grp { margin: 18px 0 8px; color: var(--river-dk); }
  .acts { display: flex; flex-direction: column; gap: 10px; }
  .act { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; background: var(--shell); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .a-ico { font-size: 2rem; text-align: center; }
  .a-info p { margin: 0 0 .3em; font-size: .95rem; }
  .note-line { color: #3c544d; font-size: .88rem !important; }
  .stars { color: #b07a00; letter-spacing: 2px; white-space: nowrap; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .step { width: 48px; height: 48px; font-size: 1.6rem; line-height: 1; border-radius: 50%; border: 2px solid var(--river); background: #fff; color: var(--river-dk); cursor: pointer; }
  .step:hover:not(:disabled) { background: var(--river); color: #fff; }
  output { min-width: 1.6em; text-align: center; font-size: 1.4rem; font-weight: bold; }
  .sticky-go { position: sticky; bottom: 0; background: linear-gradient(to top, var(--fog) 75%, transparent); padding: 12px 0; margin-bottom: 0; }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice { font: inherit; text-align: left; padding: 14px 16px; border-radius: 10px; border: 2px solid var(--river); background: #fff; color: var(--spruce); cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-height: 60px; }
  .choice:hover:not(:disabled) { background: #eaf3f1; }
  .report { list-style: none; padding: 0; margin: 0; }
  .report li { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid #e3ebe8; }
  .report li.warn { color: var(--warn); font-weight: bold; }
  .report li.good { color: #2d5a2a; font-weight: bold; }
  .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin: 14px 0; }
  .results-grid > div { background: #eef4f1; border-radius: 8px; padding: 12px 14px; }
  .big { font-size: 1.6rem; color: #b07a00; letter-spacing: 3px; margin: 0; }
  .think li { margin-bottom: .6em; }
  .today a { color: var(--river-dk); font-weight: bold; }
  @media (max-width: 560px) { .act { grid-template-columns: 40px 1fr; } .stepper { grid-column: 1 / -1; justify-content: flex-end; } h1 { font-size: 1.8rem; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<noscript>This game needs JavaScript turned on.</noscript>
<script src="areas/northwest.js"></script>
<script src="game.js"></script>
</body>
</html>
